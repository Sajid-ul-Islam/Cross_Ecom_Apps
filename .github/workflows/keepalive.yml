name: Keep gateway awake (Render free tier)

# Pings the deployed DEEN gateway every 10 minutes so Render's free tier
# never hits its 15-min idle sleep. The instance is asleep -> it can't
# ping itself, so this external cron is the trigger.
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes, UTC
  workflow_dispatch: {}       # also runnable manually from the Actions tab

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions: {}               # no repo permissions needed, just an outbound HTTP call

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health + warm catalog
        env:
          URL: ${{ secrets.RENDER_GATEWAY_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "RENDER_GATEWAY_URL secret is not set — skipping."; exit 0
          fi
          echo "Pinging $URL/v1/health"
          curl -fsS --max-time 20 "$URL/v1/health" || echo "health ping failed"
          echo "Warming catalog $URL/v1/deen/products?per_page=1"
          curl -fsS --max-time 40 "$URL/v1/deen/products?per_page=1" || echo "catalog warm failed"
          echo "done"
