name: EAS OTA Update (Mobile)

on:
  push:
    branches:
      - master
    paths:
      # Only trigger when mobile app JS/assets change (skip API/Web-only changes)
      - "apps/mobile/**"

jobs:
  publish-ota-update:
    name: Publish EAS OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA Update to production channel
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --channel production \
            --message "Auto OTA: ${{ github.event.head_commit.message }}" \
            --non-interactive
