name: CI — Typecheck & Build

# Runs on every push and PR to catch TypeScript errors and broken builds
# before they reach the deployed gateway or web store.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── API Gateway (Fastify / TypeScript) ─────────────────────────────────
  api-typecheck:
    name: API — TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — noEmit check
        run: npx tsc --noEmit

  # ── Next.js Web Store ──────────────────────────────────────────────────
  web-typecheck:
    name: Web — TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript — noEmit check
        run: npx tsc --noEmit

  web-build:
    name: Web — Next.js build
    runs-on: ubuntu-latest
    needs: web-typecheck
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          # Gateway runs in seed mode during CI — no live WooCommerce keys needed
          NEXT_PUBLIC_API_URL: "http://localhost:8787"
        run: npm run build
